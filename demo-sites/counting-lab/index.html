<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CountingLab — order analytics</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
</head>
<body>
  <header class="top"><div class="logo">Counting<span>Lab</span></div><nav><a class="active" href="#">Overview</a><a href="#orders">Orders</a><a href="#">Reports</a></nav><span class="pill">demo data</span></header>
  <main>
    <div class="head"><div><h1>Order analytics</h1><p class="sub">Numbers are computed live from a fixed fixture set — some of them incorrectly.</p></div><span class="badge" id="buildTag">local</span></div>
    <section class="kpis" id="kpis"></section>
    <section class="card" id="orders">
      <div class="card-head"><h2>Recent orders</h2><span class="sub" id="rangeLabel"></span></div>
      <div id="orderTable"></div>
      <div class="pager"><button id="prev">‹ Previous</button><span id="pageLabel">Page 1</span><button id="next">Next ›</button></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
